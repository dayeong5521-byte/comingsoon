<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026_Graduation_Project</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
    <div class="container">
        <nav class="sidebar">
            <div class="profile-summary">
                <div class="profile-pic"></div>
                <div class="profile-info">
                    <span class="name">코다영의 프로젝트</span>
                    <span class="tag">취미</span>
                </div>
            </div>
            <div class="search-nav">
                <input type="text" placeholder="찾다...">
            </div>
            <ul class="nav-links">
                <li onclick="showPage('main')">개요</li>
                <li onclick="showPage('hunt')">배포</li>
                <li onclick="showPage('focus-group')">로그</li>
                <li onclick="showPage('analysis')">해석학</li>
                <li onclick="showPage('dashboard')" class="active">속도 인사이트</li>
            </ul>
        </nav>

        <main class="content">
            <section id="main" class="page">
                <div class="header-container">
                    <h2 class="page-title">시작하기</h2>
                    <div class="search-bar">
                        <input type="text" id="search-input" placeholder="키워드를 검색하세요...">
                        <button onclick="searchKeywords()">검색</button>
                    </div>
                </div>
                <div class="main-placeholder">
                    <p>성과 지표 수집을 시작하려면 검색을 진행하세요.</p>
                </div>
            </section>

            <section id="hunt" class="page">
                <div class="header-container">
                    <h2 class="page-title">배포 기록</h2>
                    <button class="save-btn" onclick="saveKeyword()">현재 키워드 저장</button>
                </div>
                <div id="search-results" class="results-grid"></div>
            </section>

            <section id="focus-group" class="page">
                <div class="header-container">
                    <h2 class="page-title">포커스 그룹</h2>
                </div>
                <div class="group-list">
                    <p>저장된 포커스 그룹 리스트가 여기에 표시됩니다.</p>
                </div>
            </section>

            <section id="dashboard" class="page active">
                <div class="header-container">
                    <h2 class="page-title">저장된 키워드 대시보드</h2>
                </div>
                <div id="dashboard-container" class="dashboard-grid"></div>
            </section>
        </main>
    </div>

    <script src="hunt.js"></script>
    <script src="app.js"></script>
</body>
</html>
